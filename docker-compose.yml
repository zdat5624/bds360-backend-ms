version: '3.8'

services:
  # ==========================================
  # 1. DATABASE TẬP TRUNG
  # ==========================================
  mysql-db:
    image: mysql:8.0
    container_name: bds360_mysql
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - ./_shared:/_shared
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 10s
      retries: 10
      start_period: 20s

  # ==========================================
  # 🌟 MESSAGE BROKER
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bds360_rabbitmq
    ports:
      - "5672:5672"   # Port giao tiếp mặc định (AMQP)
      - "15672:15672" # Port trang quản lý UI (Web)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. NESTJS SERVICES (Node.js) - Hot Reload
  # ==========================================
  media-service:
    image: node:20-alpine
    container_name: bds360_media
    working_dir: /app
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./_shared:/_shared
      - ./media-service:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start:dev"

  notification-service:
    image: node:20-alpine
    container_name: bds360_notification
    working_dir: /app
    ports:
      - "3002:3002"
      - "9095:9095"
    env_file:
      - .env # Nạp biến từ .env
    volumes:
      - ./_shared:/_shared
      - ./notification-service:/app
      - /app/node_modules
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DB_DATABASE=${MYSQL_DATABASE_NOTIFICATION}
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ==========================================
  # 3. .NET SERVICE (C#) - Hot Reload
  # ==========================================
  statistic-service:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: bds360_statistic
    working_dir: /app
    ports:
      - "5001:5001"
    env_file:
    - .env
    volumes:
      - ./_shared:/_shared
      - ./statistic-service:/app
    environment:
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ASPNETCORE_ENVIRONMENT=Development
    command: dotnet watch run --urls "http://0.0.0.0:5001"

  # ==========================================
  # 4. SPRING BOOT SERVICES (Java) - Hot Reload
  # ==========================================
  api-gateway:
    image: eclipse-temurin:21-jdk-jammy
    container_name: bds360_gateway
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./_shared:/_shared
      - ./api-gateway:/app
      - gateway_cache:/root/.gradle
    command: ./gradlew bootRun -t

  identity-service:
    image: eclipse-temurin:21-jdk-jammy
    container_name: bds360_identity
    working_dir: /app
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - ./_shared:/_shared
      - ./identity-service:/app
      - identity_cache:/root/.gradle
    environment:
      - DB_URL=jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE_IDENTITY}?createDatabaseIfNotExist=true&serverTimezone=UTC
    command: ./gradlew bootRun -t
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  listing-service:
    image: eclipse-temurin:21-jdk-jammy
    container_name: bds360_listing
    working_dir: /app
    ports:
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - ./_shared:/_shared
      - ./listing-service:/app
      - listing_cache:/root/.gradle
    environment:
      - DB_URL=jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE_LISTING}?createDatabaseIfNotExist=true&serverTimezone=UTC
    command: ./gradlew bootRun -t
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    image: eclipse-temurin:21-jdk-jammy
    container_name: bds360_payment
    working_dir: /app
    ports:
      - "8083:8083"
    env_file:
      - .env
    volumes:
      - ./_shared:/_shared
      - ./payment-service:/app
      - payment_cache:/root/.gradle
    environment:
      - DB_URL=jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE_PAYMENT}?createDatabaseIfNotExist=true&serverTimezone=UTC
    command: ./gradlew bootRun -t
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

# ==========================================
# KHAI BÁO VOLUMES DÙNG CHUNG
# ==========================================
volumes:
  mysql_data:
  gateway_cache:
  identity_cache:
  listing_cache:
  payment_cache:
  rabbitmq_data: