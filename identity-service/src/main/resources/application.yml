server:
  port: ${IDENTITY_PORT:8081}

spring:
  application:
    name: identity-service
  main:
    lazy-initialization: false
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${MYSQL_DATABASE_IDENTITY:bds360_identity_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-retries: 3

grpc:
  server:
    address: 0.0.0.0
    port: ${GRPC_IDENTITY_PORT:9091}

api:
  jwt:
    base64-secret: ${JWT_SECRET}
    token-validity-in-seconds: ${JWT_TOKEN_VALIDITY_IN_SECONDS:86400000}