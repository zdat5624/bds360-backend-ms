# ==========================================
# SERVER
# ==========================================
server:
  port: ${LISTING_PORT:8082}


# ==========================================
# APPLICATION
# ==========================================
spring:
  application:
    name: listing-service

  # ==========================================
  # JPA
  # ==========================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        '[jdbc.batch_size]': 1000
        '[jdbc.batch_versioned_data]': true
        '[order_inserts]': true
        '[order_updates]': true

  # ==========================================
  # DATABASE
  # ==========================================
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/bds360_listing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ==========================================
  # RABBITMQ
  # ==========================================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-retries: 3



# ==========================================
# gRPC
# ==========================================
grpc:
  server:
    address: 0.0.0.0
    port: ${GRPC_LISTING_PORT:9092}
  client:
    identity-service:
      address: static://${IDENTITY_HOST:localhost}:${GRPC_IDENTITY_PORT:9091}
      negotiation-type: plaintext
    payment-service:
      address: static://${PAYMENT_HOST:localhost}:${GRPC_PAYMENT_PORT:9093}
      negotiation-type: plaintext

# ==========================================
# JWT
# ==========================================
api:
  jwt:
    token-validity-in-seconds: ${JWT_TOKEN_VALIDITY_IN_SECONDS:86400000}
    base64-secret: ${JWT_SECRET}

# ==========================================
# APPLICATION URLS
# ==========================================
app:
  url:
    backend: ${BACKEND_URL:http://localhost:8080}
    frontend: ${FRONTEND_URL:http://localhost:3000}

# ==========================================
# MAPBOX
# ==========================================
mapbox:
  api:
    key: ${MAPBOX_API_KEY}