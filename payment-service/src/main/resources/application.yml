server:
  port: ${PAYMENT_PORT:8083}

spring:
  application:
    name: payment-service
  main:
    lazy-initialization: false
  devtools:
    restart:
      enabled: true
      poll-interval: 500ms
      quiet-period: 300ms
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${MYSQL_DATABASE_PAYMENT:bds360_payment_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-retries: 3

grpc:
  server:
    address: 0.0.0.0
    port: ${GRPC_PAYMENT_PORT:9093}
  client:
    identity-service:
      address: static://${IDENTITY_HOST:localhost}:${GRPC_IDENTITY_PORT:9091}
      negotiation-type: plaintext

api:
  jwt:
    base64-secret: ${JWT_SECRET}
    token-validity-in-seconds: ${JWT_TOKEN_VALIDITY_IN_SECONDS:86400000}

vnp:
  tmn-code: ${VNP_TMN_CODE:87U46G89}
  secret-key: ${VNP_SECRET_KEY:VCFPST44XXTNDK11SOPGNS6X6GAKO99I}
  pay-url: ${VNP_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url-backend: ${BACKEND_URL:http://localhost:8080}/api/v1/payment/vnpay-return
  return-url-frontend: ${FRONTEND_URL:http://localhost:3000}/user/payments/result